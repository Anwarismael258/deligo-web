
name: deligo_app
description: "Deligo - Delivery App com Mapbox, Debito Pay e Realtime"
publish_to: 'none'

version: 1.0.8+9

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^14.2.0
  supabase_flutter: ^2.8.1
  local_auth: ^2.3.0
  flutter_dotenv: ^5.1.0
  image_picker: ^1.2.1
  flutter_image_compress: ^2.5.1
  http: ^1.1.0
  http_parser: ^4.0.2
  # Firebase removido - causava crashes
  # firebase_core: ^2.25.4
  # firebase_messaging: ^14.7.10
  google_maps_flutter: ^2.5.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  uuid: ^4.4.0
  fl_chart: ^0.68.0
  shimmer: ^3.0.0
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  firebase_core: ^3.5.0
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.2.2
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.0
  share_plus: ^10.1.4
  package_info_plus: ^8.3.0
  video_player: ^2.9.2
  qr_flutter: ^4.1.0
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.5
  mobile_scanner: ^7.2.0
  app_links: ^6.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  # 2.19.6 triggers D8 Kotlin-metadata rewriting warnings with the
  # current Android toolchain; keep the compatible cached implementation.
  google_maps_flutter_android: 2.19.2

flutter:
  uses-material-design: true
  assets:
    - assets/1000162336.png
    - assets/deligo_official_poster.png
    - assets/markers/
    - assets/marketing/
    - assets/guest/floating/
    - assets/guest/deligo_live_365.txt
    - assets/assets de categoria]/
    - assets/bottom_nav/cliente/
    - assets/bottom_nav/estafeta/
    - assets/sounds/
    - assets/micro_feedback/
    - assets/payments/emola.png
    - assets/payments/mpesa.png
    - assets/payments/mkesh.jpg


flutter_icons:
  android: true
  ios: true
  image_path: "assets/launcher/deligo_cart_icon.png"
  min_sdk_android: 21

