# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - ".dart_tool/**"
    - ".flutter_home/**"
    - ".tmp_*/**"
    - ".toolhome/**"
    - "deligo_admin/**"
    - "build/**"
  errors:
    missing_required_param: error
    missing_return: error
    todo: ignore
    invalid_annotation_target: ignore
    deprecated_member_use: ignore
    deprecated_member_use_from_same_package: ignore
    use_build_context_synchronously: ignore
    unused_field: ignore
    unused_local_variable: ignore
    unused_element: ignore
    unused_import: ignore
    unnecessary_brace_in_string_interps: ignore
    unnecessary_import: ignore
    unnecessary_underscores: ignore

linter:
  rules:
    avoid_print: true
    prefer_const_constructors: false
    prefer_const_literals_to_create_immutables: false
    use_key_in_widget_constructors: false
    library_private_types_in_public_api: false
    prefer_single_quotes: false
    avoid_unnecessary_containers: false
    sized_box_for_whitespace: false
    use_full_hex_values_for_flutter_colors: false
    prefer_if_null_operators: false
    prefer_is_empty: false
    prefer_is_not_empty: false
    avoid_returning_null_for_void: false
    avoid_void_async: false
    cancel_subscriptions: true
    close_sinks: true
    always_declare_return_types: false
    avoid_classes_with_only_static_members: false
